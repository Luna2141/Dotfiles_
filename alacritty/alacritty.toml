# ~/.config/alacritty/alacritty.toml

[env]
TERM = "xterm-256color"

[window]
decorations = "buttonless"
opacity = 0.85 # Adjusted down for a smooth, semi-transparent blend
blur = true
padding = { x = 12, y = 12 }
dynamic_padding = false
option_as_alt = "Both"

[font]
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Bold" }
italic = { family = "JetBrains Mono", style = "Italic" }
bold_italic = { family = "JetBrains Mono", style = "Bold Italic" }
size = 11.0

# --- Catppuccin Mocha Color Scheme ---
[colors.primary]
background = '#1E1E2E'
foreground = '#CDD6F4'
dim_foreground = '#CDD6F4'
bright_foreground = '#CDD6F4'

[colors.cursor]
text = '#1E1E2E'
cursor = '#F5E0DC'

[colors.vi_mode_cursor]
text = '#1E1E2E'
cursor = '#B4BEFE'

[colors.selection]
text = '#1E1E2E'
background = '#F5E0DC'

[colors.normal]
black   = '#45475A'
red     = '#F38BA8'
green   = '#A6E3A1'
yellow  = '#F9E2AF'
blue    = '#89B4FA'
magenta = '#F5C2E7'
cyan    = '#94E2D5'
white   = '#BAC2DE'

[colors.bright]
black   = '#585B70'
red     = '#F38BA8'
green   = '#A6E3A1'
yellow  = '#F9E2AF'
blue    = '#89B4FA'
magenta = '#F5C2E7'
cyan    = '#94E2D5'
white   = '#A6ADC8'
