# ~/.config/kitty/kitty.conf

# --- Window Settings ---
# Kitty doesn't have a direct "buttonless" equivalent, but this hides the title bar
hide_window_decorations yes
background_opacity 0.85
# Blur is handled by your compositor (e.g., KWin, Hyprland), not kitty.conf
window_padding_width 12
# Note: macOS option_as_alt is handled differently in kitty; 
# you can use 'macos_option_as_alt left' or 'right'
macos_option_as_alt both

# --- Font Settings ---
font_family      JetBrains Mono Regular
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        11.0

# --- Catppuccin Mocha Color Scheme ---
background #1E1E2E
foreground #CDD6F4

cursor #F5E0DC
cursor_text_color #1E1E2E

selection_background #F5E0DC
selection_foreground #1E1E2E

# Normal colors
color0 #45475A
color1 #F38BA8
color2 #A6E3A1
color3 #F9E2AF
color4 #89B4FA
color5 #F5C2E7
color6 #94E2D5
color7 #BAC2DE

# Bright colors
color8 #585B70
color9 #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #89B4FA
color13 #F5C2E7
color14 #94E2D5
color15 #A6ADC8
